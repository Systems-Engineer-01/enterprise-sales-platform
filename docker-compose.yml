services:

  postgres:
    image: postgres:18.6
    container_name: enterprise-sales-platform-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: enterprise_sales_platform
      POSTGRES_USER: enterprise_sales_app
      POSTGRES_PASSWORD: py-55

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U enterprise_sales_app -d enterprise_sales_platform" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
